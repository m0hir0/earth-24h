<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">

<title>地球をもう一度 | 地球の24時間</title>
<meta name="description" content="46億年の地球を、1000回やり直したら。偶然の関門をくぐって、わたしたち人類が現れる地球はいくつあるだろう。そして、この地球の、あなたへ続く偶然の糸。">
<meta property="og:title" content="地球をもう一度">
<meta property="og:description" content="地球を1000回やり直しても、人類は現れなかった。それでも、わたしはここにいる。">

<style>
  /* 地球をもう一度：暗い宇宙のような1枚の画面で、上に絵、下に言葉、いちばん下にボタン */
  :root {
    color-scheme: dark;
    --bg: #07090f; --surface: #10141e; --line: #222a3a; --text: #eef2f8; --text-2: #aab6c8; --muted: #6f7c90;
    --gold: #ffd84a; --accent: #f0773f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", sans-serif; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; min-height: 100svh; display: flex; flex-direction: column;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 8px; font-size: 13px; }
  .top a { color: var(--text-2); text-decoration: none; font-weight: 800; }
  .top button { background: none; border: 1px solid var(--line); color: var(--text-2); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }

  .stage { position: relative; margin: 4px 0 10px; }
  canvas { display: block; width: 100%; height: auto; image-rendering: crisp-edges; image-rendering: pixelated; border-radius: 12px; }
  #a-grid { aspect-ratio: 8 / 5; background: radial-gradient(ellipse at 50% 40%, #121a2c 0%, #07090f 75%); }
  #a-scene { aspect-ratio: 3 / 1; }
  .clock { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; white-space: nowrap; color: var(--text-2); font-variant-numeric: tabular-nums; margin-top: 6px; }
  .clock b { color: var(--accent); font-weight: 900; }
  .ours { font-size: 12px; color: var(--gold); }

  .text { flex: 1; }
  .kick { font-size: 12px; font-weight: 900; letter-spacing: .08em; color: var(--accent); margin: 4px 0 2px; }
  h1, .big { font-size: clamp(22px, 6.4vw, 30px); line-height: 1.45; margin: 4px 0 10px; font-weight: 900; white-space: pre-line; }
  .body { font-size: 15.5px; color: var(--text-2); margin: 0 0 10px; }
  .body b { color: var(--text); }
  .fade { animation: fade .6s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .count { font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; margin: 0 0 6px; }
  .count b { font-size: 22px; color: var(--text); }
  .count.humans b { color: var(--gold); }
  .legend { list-style: none; margin: 4px 0 8px; padding: 0; display: grid; gap: 3px; font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .legend li { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: block; }
  .legend .n { color: var(--text); font-weight: 800; }
  .dots { display: flex; gap: 5px; justify-content: center; margin: 2px 0 8px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--gold); }
  .note { font-size: 11.5px; color: var(--muted); margin: 6px 0 0; }

  .actions { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 0 6px; }
  .btn { display: inline-flex; justify-content: center; align-items: center; min-width: 220px; border: none; border-radius: 999px; padding: 13px 22px;
    font: inherit; font-size: 16px; font-weight: 900; background: var(--accent); color: #141413; cursor: pointer; text-decoration: none; }
  .btn.ghost { background: none; color: var(--text-2); border: 1px solid var(--line); font-size: 14px; padding: 9px 18px; min-width: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .year { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 4px 0 8px; font-size: 14px; color: var(--text-2); }
  .year input { width: 96px; font: inherit; font-size: 16px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
  .year button { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 10px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
  .final { text-align: center; }
  .final .big { font-size: clamp(24px, 7vw, 34px); }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="./" id="a-home"></a><button type="button" id="a-lang"></button></div>
  <div class="stage">
    <canvas id="a-grid" width="320" height="200" aria-hidden="true"></canvas>
    <canvas id="a-scene" hidden aria-hidden="true"></canvas>
    <div class="clock"><span id="a-clock"></span><span class="ours" id="a-ours"></span></div>
  </div>
  <div class="text" id="a-text" aria-live="polite"></div>
  <div class="actions" id="a-actions"></div>
</div>

</html>
