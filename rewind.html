<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<script src="move.js?v=202610272133"></script>
<link rel="canonical" href="https://earth24h.com/rewind">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地球をさかのぼる | 地球の24時間</title>
<meta name="description" content="下へスクロールすると、時間がさかのぼる。画面にはいつも、今からあなたのいる時点までが入り、進むほど人類の歴史は細い線に縮んでいく。46億年の底から見た、あなたの今。">
<meta property="og:title" content="地球をさかのぼる">
<meta property="og:description" content="スクロールで46億年をさかのぼる。人類の歴史は、いちばん上の細い線の中。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://earth24h.com/rewind">
<meta property="og:image" content="https://earth24h.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  /* 地球をさかのぼる：上が今、下があなたのいる時点。スクロールすると縮尺がなめらかに変わり、上のものが縮んでいく */
  :root {
    color-scheme: dark;
    --bg: #07090f; --surface: #10141e; --line: #222a3a; --text: #eef2f8; --text-2: #aab6c8; --muted: #6f7c90;
    --gold: #ffd84a; --accent: #f0773f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", sans-serif; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }

  .hud { position: sticky; top: 0; z-index: 5; background: rgba(7, 9, 15, .92); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line); padding: 8px 0 6px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .hud .row1 { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-2); }
  .hud .row1 a { color: var(--text-2); text-decoration: none; font-weight: 800; }
  .hud .row1 button { background: none; border: 1px solid var(--line); color: var(--text-2); border-radius: 999px; padding: 2px 9px; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; }
  .hud .stage { color: var(--accent); font-weight: 900; letter-spacing: .02em; font-size: 12px; white-space: nowrap; }
  .hud .btns { display: flex; gap: 6px; }
  .hud .row3 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .hud .prog { display: flex; align-items: center; gap: 8px; margin-top: 3px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hud .prog .bar { flex: 1; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .hud .prog .bar i { display: block; height: 100%; width: 0; background: var(--gold); }
  .hud #r-sound[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); }
  .hud .clock { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.25; white-space: nowrap; }
  .hud .clock.long { font-size: 19px; line-height: 1.58; }
  .hud .ago { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }

  .intro, .outro { min-height: 80svh; display: flex; flex-direction: column; justify-content: center; padding: 24px 0; }
  .kick { font-size: 12px; font-weight: 900; letter-spacing: .08em; color: var(--accent); }
  .big { font-size: clamp(24px, 7vw, 34px); line-height: 1.4; font-weight: 900; margin: 6px 0 12px; white-space: pre-line; }
  .body { font-size: 15.5px; color: var(--text-2); margin: 0 0 10px; }
  .body b { color: var(--text); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 18px; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(6px); } }

  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 10px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
  .btn.main { background: var(--accent); color: #141413; border: none; border-radius: 999px; padding: 13px 22px; font-size: 16px; font-weight: 900; text-decoration: none; display: inline-flex; justify-content: center; }
  .btn.ghost { border-radius: 999px; text-decoration: none; display: inline-flex; padding: 9px 16px; color: var(--text-2); }
  .actions { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 14px; }
  .actions .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

  /* ズームの区間：中の .zstage が上に貼りついたまま、縮尺だけがなめらかに変わる */
  .zoomer { position: relative; }
  .zstage { position: sticky; display: flex; flex-direction: column; padding: 4px 0 10px; }
  #tl { flex: 1; min-height: 0; width: 100%; display: block; }
  .now { position: relative; flex: none; }
  #now-scene { display: block; width: 100%; height: auto; aspect-ratio: 3 / 1; border-radius: 10px; image-rendering: crisp-edges; image-rendering: pixelated; }
  .now .cap { position: absolute; left: 8px; right: 8px; bottom: 6px; font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, .9); }
  /* 今に戻ったあと：あなたの街 → 地球 → 宇宙の小さな点 */
  .pb { position: fixed; inset: 0; z-index: 20; background: #000; transition: opacity .9s ease; }
  .pb.out { opacity: 0; }
  .pb canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pb-cap { position: absolute; left: 16px; right: 16px; bottom: 16%; margin: 0; text-align: center; font-size: clamp(17px, 5vw, 22px); font-weight: 800; color: #eef2f8;
    white-space: pre-line; transition: opacity 1s ease; opacity: 0; }
  .pb-cap.on { opacity: 1; }
  .pb button { position: absolute; right: 16px; top: max(14px, env(safe-area-inset-top, 0px)); background: none; border: 1px solid #333a48; color: #aab6c8; border-radius: 999px;
    padding: 4px 12px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .final .big { font-size: clamp(24px, 7vw, 32px); }
  @media (prefers-reduced-motion: reduce) { .hint { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="row1"><a href="./" id="r-home"></a><span class="btns"><button type="button" id="r-sound" aria-pressed="false"></button><button type="button" id="r-lang"></button></span></div>
    <div class="clock" id="h-clock"></div>
    <div class="row3"><span class="ago" id="h-ago"></span><span class="stage" id="h-stage"></span></div>
    <div class="prog"><span class="bar"><i id="h-bar"></i></span><span id="h-pct"></span></div>
  </div>
  <div class="intro" id="intro"></div>
  <div class="zoomer" id="zoomer">
    <div class="zstage" id="stage">
      <canvas id="tl" aria-hidden="true"></canvas>
      <div class="now"><canvas id="now-scene" aria-hidden="true"></canvas><span class="cap" id="now-cap" aria-live="polite"></span></div>
    </div>
  </div>
  <div class="outro" id="outro"></div>
</div>
<div class="pb" id="pb" hidden><canvas id="pb-c" aria-hidden="true"></canvas><p class="pb-cap" id="pb-cap" aria-live="polite"></p><button type="button" id="pb-skip"></button></div>

</html>
