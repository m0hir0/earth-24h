<head>

<title>地球をさかのぼる | 地球の24時間</title>
<meta name="description" content="今から下へスクロールすると、時間がさかのぼる。最後の100年、1万年、100万年……と遠ざかるほど、人類の歴史は細い線になっていく。46億年の底から見た、あなたの今。">
<meta property="og:title" content="地球をさかのぼる">
<meta property="og:description" content="スクロールで46億年をさかのぼる。人類の歴史は、いちばん上の細い線の中。">

<style>
  /* 地球をさかのぼる：縦に長い1本の時間。上が今、下が46億年前。段階ごとに100倍ずつ遠ざかる */
  :root {
    color-scheme: dark;
    --bg: #07090f; --surface: #10141e; --line: #222a3a; --text: #eef2f8; --text-2: #aab6c8; --muted: #6f7c90;
    --gold: #ffd84a; --accent: #f0773f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", sans-serif; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }

  .hud { position: sticky; top: 0; z-index: 5; background: rgba(7, 9, 15, .92); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line); padding: 8px 0 6px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .hud .row1 { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-2); }
  .hud .row1 a { color: var(--text-2); text-decoration: none; font-weight: 800; }
  .hud .row1 button { background: none; border: 1px solid var(--line); color: var(--text-2); border-radius: 999px; padding: 2px 9px; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; }
  .hud .stage { color: var(--accent); font-weight: 900; letter-spacing: .04em; }
  .hud .clock { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .hud .ago { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }

  .intro, .outro, .zoom { min-height: 80svh; display: flex; flex-direction: column; justify-content: center; padding: 24px 0; }
  .zoom { min-height: 70svh; text-align: center; }
  .kick { font-size: 12px; font-weight: 900; letter-spacing: .08em; color: var(--accent); }
  .big { font-size: clamp(24px, 7vw, 34px); line-height: 1.4; font-weight: 900; margin: 6px 0 12px; white-space: pre-line; }
  .body { font-size: 15.5px; color: var(--text-2); margin: 0 0 10px; }
  .body b { color: var(--text); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 18px; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(6px); } }
  .zoom .x { font-size: 44px; font-weight: 900; color: var(--gold); letter-spacing: .02em; }

  .year { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; font-size: 14px; color: var(--text-2); }
  .year input { width: 96px; font: inherit; font-size: 16px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
  .year button, .btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 10px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
  .btn.main { background: var(--accent); color: #141413; border: none; border-radius: 999px; padding: 13px 22px; font-size: 16px; font-weight: 900; text-decoration: none; display: inline-flex; justify-content: center; }
  .btn.ghost { border-radius: 999px; text-decoration: none; display: inline-flex; padding: 9px 16px; color: var(--text-2); }
  .actions { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 14px; }
  .actions .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

  /* 時間の段（section） */
  .sec { position: relative; margin: 0 0 0 0; }
  .sec .title { position: absolute; left: 30px; top: -2px; font-size: 12px; font-weight: 900; color: var(--accent); }
  .rail { position: absolute; left: 6px; top: 0; bottom: 0; width: 10px; border-radius: 5px; overflow: hidden; }
  .rail i { position: absolute; left: 0; right: 0; display: block; }
  .band { position: absolute; left: 0; right: 0; top: 0; background: rgba(255, 216, 74, .9); border-radius: 2px; box-shadow: 0 0 14px rgba(255, 216, 74, .6); }
  .band-label { position: absolute; left: 30px; font-size: 12px; color: var(--gold); font-weight: 800; }
  .life { position: absolute; left: 0; right: 0; top: 0; background: rgba(255, 216, 74, .16); border-top: 2px solid var(--gold); }
  .life span { position: absolute; right: 0; top: 4px; font-size: 12px; font-weight: 900; color: var(--gold); }
  .tick { position: absolute; left: 0; right: 0; border-top: 1px dashed rgba(170, 182, 200, .12); }
  .tick span { position: absolute; right: 0; top: 2px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ev { position: absolute; left: 30px; right: 0; }
  .ev .dot { position: absolute; left: -26px; width: 12px; height: 12px; border-radius: 50%; background: var(--text); border: 2px solid var(--bg); }
  .ev .lead { position: absolute; left: -14px; width: 10px; border-top: 1px solid var(--muted); }
  .ev b { display: block; font-size: 15px; line-height: 1.4; }
  .ev small { display: block; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ev canvas { display: block; width: min(100%, 280px); height: auto; aspect-ratio: 3 / 1; margin-top: 4px; border-radius: 8px; image-rendering: crisp-edges; image-rendering: pixelated; }
  .quiet { position: absolute; left: 30px; right: 0; font-size: 13px; color: var(--muted); font-style: italic; }
  .now-line { position: absolute; left: 0; right: 0; top: 0; border-top: 2px solid var(--gold); }
  .now-line span { position: absolute; left: 30px; top: -10px; font-size: 12px; color: var(--gold); font-weight: 900; background: var(--bg); padding: 0 6px; }
  .final .big { font-size: clamp(24px, 7vw, 32px); }
  @media (prefers-reduced-motion: reduce) { .hint { animation: none; } }
</style>
</head>

<div class="wrap">
  <div class="hud">
    <div class="row1"><a href="./" id="r-home"></a><span class="stage" id="h-stage"></span><button type="button" id="r-lang"></button></div>
    <div class="clock" id="h-clock"></div>
    <div class="ago" id="h-ago"></div>
  </div>
  <div id="track"></div>
</div>
